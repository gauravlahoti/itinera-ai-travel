steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app', '--all-tags']

  # Deploy container image to Cloud Run with the Gemini API key from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'itinera'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-secrets=GOOGLE_API_KEY=google-ai-api-key:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/itinera/app:latest'
